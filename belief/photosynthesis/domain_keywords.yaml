# Domain keyword allowlist for Photosynthesis stage-1 filter.
#
# Each list entry is a bare term. Case-insensitive; compiled once into a
# \b-bounded regex at boot time. Hyphen variants (e.g. sentence-transformers
# and sentence_transformers) matter — keep both where applicable.
#
# Design guidance: ~200 terms total. Narrow enough to be meaningful, wide
# enough that every plausibly-relevant trending repo / PyPI release / HN
# post has at least one match. Signals with zero matches fail stage 1 and
# are dropped before they touch TF-IDF. Tune over time; the weekly drift
# report (Session 5) will surface terms that should be added or removed.

