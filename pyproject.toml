[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-engine"
version = "3.2.0"
description = "Autonomous AI build system. Describe what you want. Belief builds it, tests it, deploys it, and learns — on your laptop, no API key required."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Fio", email = "metafiopy@gmail.com"},
]
keywords = ["ai", "agents", "code-generation", "autonomous", "langgraph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0.0",
    # Session 1 (v3.2): Ollama client hardening — retry + circuit breaker.
    # Both were previously only in the photosynthesis extra; promoted to
    # core because belief.llm now uses them on every LLM call.  The
    # imports in belief/llm.py are wrapped in try/except so an install
    # that predates this change still boots (with retry/breaker disabled).
    "tenacity>=9.0",
    "pybreaker>=1.0",
    # Session 2 (v3.2): LibCST Pydantic v2 covenant enforcer.
    # libcst does the structural rewrites, ruff --fix cleans up unused
    # imports post-rewrite, bump-pydantic catches patterns the covenant
    # is conservative about (GenericModel, etc.).  All three run via
    # subprocess or imported API — the covenant pipeline tolerates them
    # missing (logs a warning, skips the stage).
    "libcst>=1.8.6",
    "bump-pydantic==0.8.0",
    "ruff>=0.9.0",
    # Session 3 (v3.2): layered package validator (slopsquatting defense).
    # rapidfuzz is required for the Levenshtein fuzzy-match suggestion
    # layer.  guarddog + pip-audit are subprocess CLI tools — moved to
    # the [security] extra so the default install stays light. The
    # executor tolerates them missing (logs and skips the check).
    "rapidfuzz>=3.0",
    # Session 4 (v3.2): synthesizer router uses radon for cyclomatic
    # complexity.  Router tolerates radon missing (treats the signal
    # as unknown), so this is a soft requirement — pinned here so the
    # default install has it.
    "radon>=6.0",
    # Session 7 (v3.2): tree-sitter + PageRank repo-map.  Ported from
    # Aider.  networkx needs scipy for its PageRank backend in 3.x.
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "networkx>=3.0",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/metafiopy-tech/belief-engine"
Repository = "https://github.com/metafiopy-tech/belief-engine"
Issues = "https://github.com/metafiopy-tech/belief-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
security = [
    # CLI tools invoked via subprocess by belief.agents.executor for
    # supply-chain security checks.  Optional — executor skips them
    # gracefully if not on PATH.
    "guarddog>=0.2",
    "pip-audit>=2.7",
]
local = [
    "ollama>=0.3.0",
]
search = [
    "duckduckgo-search>=6.0.0",
]
multiservice = [
    "openapi-pydantic>=0.5.0",
    "python-on-whales>=0.70.0",
    "schemathesis>=3.0.0",
    "pyyaml>=6.0.0",
]
optimize = [
    "dspy>=2.6.0",
]
brownfield = [
    "networkx>=3.0",
    "gitpython>=3.1.0",
    "unidiff>=0.7.0",
    "pytest-testmon>=2.0.0",
]
verification = [
    "schemathesis>=3.0.0",
    "hypothesis>=6.0.0",
    "hypothesis-jsonschema>=0.23.0",
    "mypy>=1.0.0",
]
photosynthesis = [
    # Scheduler + resilience
    "apscheduler>=3.11,<4.0",   # NOT 4.x per design note
    "tenacity>=9.0",
    "pybreaker>=1.0",
    # HTTP / feeds
    "feedparser>=6.0",
    # Session 0.5 (2026-04-23): dropped `arxiv>=2.0`.  The package uses
    # a private requests.Session with no injection hook, which bypassed
    # belief.core.http's retry / breaker / allowlist.  Now hitting
    # export.arxiv.org directly via the shared BreakerAsyncClient.
    # Filter cascade (stage 0/2/3)
    "pybloom-live>=4.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
]
photosynthesis-test = [
    # Lightweight test subset: everything except heavy ML models, so
    # CI or contributor machines can run test_state / test_sources_offline
    # without pulling PyTorch.
    "apscheduler>=3.11,<4.0",
    "tenacity>=9.0",
    "pybreaker>=1.0",
    "feedparser>=6.0",
    "respx>=0.21",
]
# Session 18: single extras spec that pulls everything a fresh install
# needs for the "full v3.1 experience" — local Ollama routing,
# Photosynthesis harvester, DSPy prompt optimisation, brownfield
# patcher, search fetchers, multi-service deployment, and API
# verification.  Explicitly re-lists the inner groups' packages
# (rather than using `belief-engine[...]` self-refs) so `pip install
# belief-engine[full]` works from PyPI without circular metadata.
full = [
    # local
    "ollama>=0.3.0",
    # search
    "duckduckgo-search>=6.0.0",
    # optimize
    "dspy>=2.6.0",
    # brownfield
    "networkx>=3.0",
    "gitpython>=3.1.0",
    "unidiff>=0.7.0",
    "pytest-testmon>=2.0.0",
    # photosynthesis (arxiv dropped in Session 0.5 — see [photosynthesis] extra)
    "apscheduler>=3.11,<4.0",
    "tenacity>=9.0",
    "pybreaker>=1.0",
    "feedparser>=6.0",
    "pybloom-live>=4.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    # verification
    "schemathesis>=3.0.0",
    "hypothesis>=6.0.0",
    "hypothesis-jsonschema>=0.23.0",
]

[project.scripts]
belief = "belief.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["belief*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# belief/hardening.py is frozen per CLAUDE.md ("DO NOT MODIFY").  Its
# 3 E402 mid-file imports are structural (sectioned file) and would
# require reshaping the module to fix — off-limits.  Excluding it here
# keeps pre-commit / CI green without touching the file.
extend-exclude = ["belief/hardening.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:chromadb",
    "ignore::DeprecationWarning:langgraph",
    "ignore::DeprecationWarning:langchain",
]
