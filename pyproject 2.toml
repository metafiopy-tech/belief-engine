[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-engine"
version = "2.0.0"
description = "Incompleteness-driven multi-agent build system. Describe what you want. Belief builds it."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
local = [
    "ollama>=0.3.0",
]
search = [
    "duckduckgo-search>=6.0.0",
]

[project.scripts]
belief = "belief.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["belief*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
